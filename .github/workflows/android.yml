name: Android build

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Tests et APK debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Le cœur métier (protocole, parsing, fusion, cache, règles d'accueil) est couvert par
      # des tests JVM qui rejouent des réponses enregistrées : aucun compte réel n'est
      # nécessaire, et une régression de protocole se voit ici avant l'APK.
      - name: Tests unitaires
        run: gradle --no-daemon testDebugUnitTest

      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ecole2recte-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
